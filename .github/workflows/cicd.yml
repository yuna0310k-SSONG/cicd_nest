name: CI
on:
  push:
    branches:
      - master
jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
      - run: npm install
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run start
      - run: npm run test:cov
      - run: npm run test:e2e
      - run: npm run test:debug
